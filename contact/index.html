{

  "@type": "ContactPage",
  "name": "Contact — start a conversation | HEXCYRA",
  "url": "%SITE%/contact/",
  "description": "Tell us what you are trying to build, fix or improve. We will figure out the next practical step with you.",

    "name": "HEXCYRA",
    "url": "%SITE%/"
  },
  "about": {
    "@type": "Organization",
    "name": "HEXCYRA",
    "url": "%SITE%/"
  },
  "mainEntity": {
    "@type": "Organization",
    "name": "HEXCYRA",
    "email": "hello@hexcyra.com",
    "url": "%SITE%/"
  }
}

    <!-- rel="canonical" is injected by the hexcyra-canonical plugin in
         vite.config.js: Vite rewrites every <link href> as an asset reference
         and a clean URL such as /contact/ is a directory on disk. %SITE% is the
         deployment host, replaced at build time. -->

    <!-- Fonts (Outfit 600-900 display + Plus Jakarta Sans 400-700 body) are
         self-hosted from @fontsource via src/fonts.js — no third-party CDN. -->
  </head>

    data-page="contact"
    class="font-sans antialiased"
