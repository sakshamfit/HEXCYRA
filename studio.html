e chaos, we build digital spaces for sharp focus and inspired work.</p><a class="cta" href="work.html">Begin Journey</a></main></div><script>function wireNavigation(){const page=location.pathname.split('/').pop()||'index.html';document.querySelectorAll('nav a').forEach(a=>{const href=a.getAttribute('href');if(href===page||(!href&&page==='index.html')){a.setAttribute('aria-current','page');a.classList.add('active')}});document.querySelectorAll('a[href="#"]').forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();a.classList.add('is-clicked');setTimeout(()=>a.classList.remove('is-clicked'),220)})})}wireNavigation();</script></body></html>
